<!doctype html><html lang="it"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Borgo Duepixel</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
/* Layout: scena a tutto schermo; HUD agli angoli, dialogo in basso al centro, comandi touch ai lati */
:root{
  color-scheme: dark;
  --void:#15121f;
  --panel:rgba(18,15,28,.88);
  --line:#4a4360;
  --ink:#f4ecd8;
  --dim:#a79fb8;
  --amber:#ffb85c;
  --amber-ink:#2a1c08;
  --display:"Pixelify Sans","Courier New",monospace;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--mono);font-size:12px;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#gl:active{cursor:grabbing}

.top{position:absolute;inset:0 0 auto 0;display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;padding:14px 16px;pointer-events:none}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:24px;line-height:1;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.brand .back{display:inline-block;margin:0 0 6px;color:var(--dim);font-size:11px;line-height:1.2;text-decoration:none;pointer-events:auto;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.brand .back:hover{color:var(--amber)}
.brand .back:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.brand p{display:inline-block;margin:8px 0 0;padding:4px 8px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.5;font-variant-numeric:tabular-nums;max-width:46ch}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;pointer-events:auto}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;padding:6px 10px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--amber)}
button:active{transform:translateY(2px);border-bottom-width:1px;margin-bottom:2px}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button[aria-pressed="true"]{color:var(--amber)}

.hint{position:absolute;left:16px;right:16px;bottom:16px;width:fit-content;margin:0 auto;box-sizing:border-box;padding:6px 12px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:11px;text-align:center;pointer-events:none;white-space:normal}
.hint b{color:var(--amber);font-weight:500}

.dialog{position:absolute;left:16px;right:16px;bottom:56px;max-width:620px;margin:0 auto;box-sizing:border-box;background:#0b0911;border:3px solid var(--ink);padding:12px 16px 18px;font-family:var(--display);font-size:20px;line-height:1.3;min-height:5.4em;cursor:pointer;text-align:left;color:var(--ink)}
.dialog .who{display:block;color:var(--amber);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.dialog .more{position:absolute;right:12px;bottom:6px;font-size:14px;color:var(--amber);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.sheet{position:absolute;right:16px;top:64px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 150px);overflow:auto;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);padding:12px}
.sheet h2{margin:0 0 4px;font-family:var(--display);font-size:16px;font-weight:600}
.sheet p{margin:0 0 10px;color:var(--dim);font-size:11px;line-height:1.5}
.sheet canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#0b0911;border:1px solid var(--line)}

.stick,.act{display:none}
.stick{position:absolute;left:20px;bottom:24px;width:116px;height:116px;border-radius:50%;border:2px solid var(--line);background:rgba(18,15,28,.5)}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ink);opacity:.85}
.act{position:absolute;right:24px;bottom:40px;width:72px;height:72px;border-radius:50%;background:var(--amber);color:var(--amber-ink);border:0;font-family:var(--display);font-size:22px;font-weight:600;align-items:center;justify-content:center}
@media (pointer:coarse){
  .stick{display:block}
  .act{display:flex}
  .hint{bottom:156px}
  .dialog{bottom:196px;font-size:18px}
}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:var(--display);font-size:18px;background:var(--void)}
@media (max-width:520px){ .brand h1{font-size:20px} .brand p{font-size:10px} button{padding:6px 8px} }
@media (prefers-reduced-motion:reduce){ .dialog .more{animation:none} }
</style>

<div id="stage">
  <canvas id="gl" tabindex="0" aria-label="Villaggio diorama: cammina con WASD, parla con Z, ruota con Q ed E"></canvas>

  <div class="top">
    <div class="brand">
      <a class="back" href="../index.html">← tutti i borghi</a>
      <h1>Borgo Duepixel</h1>
      <p id="stats">Estrusione dei pixel in corso…</p>
    </div>
    <div class="bar" role="toolbar" aria-label="Comandi della scena">
      <button id="bRotL" type="button" aria-label="Ruota a sinistra">⟲ Q</button>
      <button id="bRotR" type="button" aria-label="Ruota a destra">E ⟳</button>
      <button id="bTod" type="button">Ora: tramonto</button>
      <button id="bDof" type="button" aria-pressed="true">Sfocatura</button>
      <button id="bSheet" type="button" aria-pressed="false">Sprite 2D</button>
      <button id="bSnd" type="button" aria-pressed="true">Suono</button>
    </div>
  </div>

  <aside id="sheet" class="sheet" hidden>
    <h2>Da qui nasce tutto</h2>
    <p id="sheetText"></p>
    <canvas id="atlas" width="8" height="8"></canvas>
  </aside>

  <div id="hint" class="hint"></div>

  <div id="dialog" class="dialog" role="button" tabindex="0" hidden>
    <span class="who" id="dWho"></span><span id="dText"></span><span class="more" id="dMore">▼</span>
  </div>

  <div id="stick" class="stick" aria-hidden="true"><i id="knob"></i></div>
  <button id="bAct" class="act" type="button" aria-label="Parla o esamina">Z</button>

  <div id="fallback" class="fallback" hidden>Il browser non ha potuto avviare WebGL, quindi il villaggio non si può disegnare.</div>
</div>

<script src="../vendor/three/three.min.js"></script>
<script>
